<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Prediction error in working minutes</title><desc id="d">Predicted Monday 5:50 PM, finished Tuesday 9:20 AM. Wall clock says 930 minutes; inside the shifts it is 30 working minutes.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#070b17"/></linearGradient>
<marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 z" fill="#94a3b8"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.45"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2"/></filter>
<style>
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes march{to{stroke-dashoffset:-24}}
.rise{animation:rise .65s cubic-bezier(.2,.8,.2,1) backwards}
.march{animation:march 1.1s linear infinite}
</style>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#0a1022"/><line x1="0" y1="0" x2="0" y2="10" stroke="#243049" stroke-width="4"/></pattern></defs>
<rect width="1200" height="640" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="638" rx="21" fill="none" stroke="#1e293b" stroke-width="2"/>
<text x="600.0" y="58" text-anchor="middle" font-size="31" font-weight="800" fill="#f8fafc">Why error is counted in working minutes</text>
<text x="600.0" y="88" text-anchor="middle" font-size="16.5" fill="#94a3b8">Predicted Mon 5:50 PM · finished Tue 9:20 AM · shifts 9-1 and 2-6</text>
<g class="rise" style="animation-delay:0.00s"><rect x="80" y="232" width="240" height="64" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/><rect x="320" y="232" width="480" height="64" fill="url(#hatch)" stroke="#334155" stroke-width="1.5"/><rect x="800" y="232" width="240" height="64" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="94" y="260" font-size="12.5" font-weight="800" fill="#6ee7b7" text-anchor="start" letter-spacing="1.4">MON SHIFT</text><text x="94" y="280" font-size="13" font-weight="600" fill="#a7f3d0" text-anchor="start">5:30 → 6:00 PM</text><text x="560.0" y="260" font-size="13" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="2.2">OVERNIGHT</text><text x="560.0" y="280" font-size="13.5" font-weight="600" fill="#64748b" text-anchor="middle">15 hours of nobody working</text><text x="814" y="260" font-size="12.5" font-weight="800" fill="#6ee7b7" text-anchor="start" letter-spacing="1.4">TUE SHIFT</text><text x="814" y="280" font-size="13" font-weight="600" fill="#a7f3d0" text-anchor="start">9:00 → 9:30 AM</text></g>
<g opacity="0"><line x1="240" y1="224" x2="240" y2="304" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round"/><circle cx="240" cy="310" r="6" fill="#818cf8"/><text x="240" y="338" font-size="13" font-weight="800" fill="#818cf8" text-anchor="middle" letter-spacing="1.2">PREDICTED</text><text x="240" y="356" font-size="13.5" fill="#cbd5e1" text-anchor="middle">Mon 5:50 PM</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0615;0.0885;0.9308;1" dur="13.0s" repeatCount="indefinite"/></g>
<g opacity="0"><line x1="960" y1="224" x2="960" y2="304" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/><circle cx="960" cy="310" r="6" fill="#fbbf24"/><text x="960" y="338" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1.2">FINISHED</text><text x="960" y="356" font-size="13.5" fill="#cbd5e1" text-anchor="middle">Tue 9:20 AM</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1000;0.1269;0.9308;1" dur="13.0s" repeatCount="indefinite"/></g>
<rect x="240" y="193" width="0" height="6" rx="3" fill="#fb7185" stroke="#fb7185" stroke-width="2" ><animate attributeName="width" values="0;0;720;720;0" keyTimes="0;0.1692;0.3231;0.8923;1" dur="13.0s" repeatCount="indefinite"/></rect>
<g opacity="0"><line x1="240" y1="196" x2="240" y2="222" stroke="#fb7185" stroke-width="2.5"/><line x1="960" y1="196" x2="960" y2="222" stroke="#fb7185" stroke-width="2.5"/><text x="600.0" y="174" font-size="21" font-weight="800" fill="#fb7185" text-anchor="middle">Wall clock: 15 h 30 min = 930 minutes ✗</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3077;0.3346;0.8923;1" dur="13.0s" repeatCount="indefinite"/></g>
<rect x="240" y="375" width="0" height="6" rx="3" fill="#34d399" stroke="#34d399" stroke-width="2" ><animate attributeName="width" values="0;0;80;80;0" keyTimes="0;0.4769;0.5231;0.8923;1" dur="13.0s" repeatCount="indefinite"/></rect>
<rect x="800" y="375" width="0" height="6" rx="3" fill="#34d399" stroke="#34d399" stroke-width="2" ><animate attributeName="width" values="0;0;160;160;0" keyTimes="0;0.5308;0.6000;0.8923;1" dur="13.0s" repeatCount="indefinite"/></rect>
<g opacity="0"><text x="280.0" y="404" font-size="15" font-weight="800" fill="#6ee7b7" text-anchor="middle">10 min</text><text x="880.0" y="404" font-size="15" font-weight="800" fill="#6ee7b7" text-anchor="middle">20 min</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5846;0.6115;0.8923;1" dur="13.0s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="80" y="482" width="500" height="112" rx="14" fill="#2a0a14" stroke="#fb7185" stroke-opacity="0.7" stroke-width="1.5"/><text x="104" y="516" font-size="13" font-weight="800" fill="#fb7185" letter-spacing="1.5">WALL-CLOCK DIFFERENCE</text><text x="104" y="550" font-size="30" font-weight="800" fill="#f8fafc">930 min</text><text x="104" y="576" font-size="14" fill="#cbd5e1">Counts the 15 idle night hours as if they were the miss.</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6462;0.6731;0.8923;1" dur="13.0s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="620" y="482" width="500" height="112" rx="14" fill="#06251d" stroke="#34d399" stroke-opacity="0.8" stroke-width="1.5"/><text x="644" y="516" font-size="13" font-weight="800" fill="#34d399" letter-spacing="1.5">SHIFT-AWARE ERROR (USED)</text><text x="644" y="550" font-size="30" font-weight="800" fill="#f8fafc">10 + 20 = <tspan fill="#34d399">30 working min</tspan></text><text x="644" y="576" font-size="14" fill="#cbd5e1">Only time the technician could actually have been working.</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7077;0.7346;0.8923;1" dur="13.0s" repeatCount="indefinite"/></g>
</svg>