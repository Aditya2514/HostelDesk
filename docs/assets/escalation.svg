<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Escalation and auto-close</title><desc id="d">Missed deadlines escalate to the warden and then the chief warden; resolved tickets close after 48 hours.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#070b17"/></linearGradient>
<marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 z" fill="#94a3b8"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>
<rect width="1200" height="650" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="648" rx="21" fill="none" stroke="#1e293b" stroke-width="2"/>
<text x="600.0" y="58" text-anchor="middle" font-size="31" font-weight="800" fill="#f8fafc">Nothing slips through</text>
<text x="600.0" y="88" text-anchor="middle" font-size="16.5" fill="#94a3b8">Deadlines escalate by themselves, and silence never leaves a ticket hanging.</text>
<rect x="30" y="112" width="1140" height="234" rx="18" fill="#0a1022" stroke="#1e293b" stroke-width="1.5"/>
<text x="54" y="142" font-size="13" font-weight="800" fill="#64748b" text-anchor="start" letter-spacing="2.2">DEADLINES  ·  CHECKED EVERY 5 MINUTES</text>
<g filter="url(#sh)"><rect x="50" y="170" width="190" height="110" rx="14" fill="#0d1428" stroke="#818cf8" stroke-opacity="0.55" stroke-width="1.5"/></g>
<rect x="50" y="184" width="5" height="82" rx="2.5" fill="#818cf8"/>
<text x="74" y="200" font-size="15.5" font-weight="800" fill="#818cf8" text-anchor="start" letter-spacing="0.6">Ticket created</text>
<text x="74" y="230" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">The category sets</text>
<text x="74" y="251.5" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">the deadline.</text>
<path d="M240,225 L270,225" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/>
<polygon points="355,163.0 440.0,225 355,287.0 270.0,225" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
<text x="355" y="221.325" font-size="14.5" font-weight="700" fill="#f8fafc" text-anchor="middle">Resolved by the</text>
<text x="355" y="238.825" font-size="14.5" font-weight="700" fill="#f8fafc" text-anchor="middle">deadline?</text>
<path d="M440,225 L480,225" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="446.6" y="199" width="26.8" height="21" rx="6" fill="#0a1022"/>
<text x="460" y="214" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">no</text>
<rect x="275" y="306" width="160" height="32" rx="16.0" fill="#064e3b" stroke="#34d399" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="355.0" y="326.9" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">No escalation</text>
<path d="M355,287 L355,306" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="369" y="300" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="start">yes</text>
<g filter="url(#sh)"><rect x="480" y="170" width="210" height="110" rx="14" fill="#0d1428" stroke="#c084fc" stroke-opacity="0.55" stroke-width="1.5"/></g>
<rect x="480" y="184" width="5" height="82" rx="2.5" fill="#c084fc"/>
<text x="504" y="200" font-size="15.5" font-weight="800" fill="#c084fc" text-anchor="start" letter-spacing="0.6">Level 1</text>
<text x="504" y="230" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">The block warden is</text>
<text x="504" y="251.5" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">alerted at the</text>
<text x="504" y="273.0" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">deadline.</text>
<path d="M690,225 L720,225" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/>
<polygon points="805,163.0 890.0,225 805,287.0 720.0,225" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
<text x="805" y="221.325" font-size="14.5" font-weight="700" fill="#f8fafc" text-anchor="middle">Still open 24 h</text>
<text x="805" y="238.825" font-size="14.5" font-weight="700" fill="#f8fafc" text-anchor="middle">later?</text>
<path d="M890,225 L930,225" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="892.9" y="199" width="34.2" height="21" rx="6" fill="#0a1022"/>
<text x="910" y="214" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">yes</text>
<rect x="725" y="306" width="160" height="32" rx="16.0" fill="#064e3b" stroke="#34d399" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="805.0" y="326.9" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">Handled</text>
<path d="M805,287 L805,306" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="819" y="300" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="start">no</text>
<g filter="url(#sh)"><rect x="930" y="170" width="230" height="110" rx="14" fill="#0d1428" stroke="#fb7185" stroke-opacity="0.55" stroke-width="1.5"/></g>
<rect x="930" y="184" width="5" height="82" rx="2.5" fill="#fb7185"/>
<text x="954" y="200" font-size="15.5" font-weight="800" fill="#fb7185" text-anchor="start" letter-spacing="0.6">Level 2</text>
<text x="954" y="230" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">The chief warden is</text>
<text x="954" y="251.5" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">alerted.</text>
<rect x="30" y="370" width="1140" height="250" rx="18" fill="#0a1022" stroke="#1e293b" stroke-width="1.5"/>
<text x="54" y="400" font-size="13" font-weight="800" fill="#64748b" text-anchor="start" letter-spacing="2.2">AFTER THE FIX  ·  48-HOUR WINDOW</text>
<g filter="url(#sh)"><rect x="50" y="430" width="250" height="130" rx="14" fill="#0d1428" stroke="#818cf8" stroke-opacity="0.55" stroke-width="1.5"/></g>
<rect x="50" y="444" width="5" height="102" rx="2.5" fill="#818cf8"/>
<text x="74" y="460" font-size="15.5" font-weight="800" fill="#818cf8" text-anchor="start" letter-spacing="0.6">Ticket resolved</text>
<text x="74" y="490" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">Room tickets: RESOLVED.</text>
<text x="74" y="511.5" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">Common areas:</text>
<text x="74" y="533.0" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">AWAITING_VERIFICATION.</text>
<path d="M300,495 L340,495" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/>
<polygon points="425,433.0 510.0,495 425,557.0 340.0,495" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
<text x="425" y="491.325" font-size="14.5" font-weight="700" fill="#f8fafc" text-anchor="middle">Student acts</text>
<text x="425" y="508.825" font-size="14.5" font-weight="700" fill="#f8fafc" text-anchor="middle">within 48 h?</text>
<path d="M510,495 L555,495 L555,440 L600,440" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="600" y="421" width="190" height="38" rx="19.0" fill="#064e3b" stroke="#34d399" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="695.0" y="445.075" font-size="14.5" font-weight="700" fill="#34d399" text-anchor="middle">Confirms</text>
<path d="M790,440 L830,440" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="842" y="445" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="start">CLOSED</text>
<path d="M510,495 L600,495" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="600" y="476" width="190" height="38" rx="19.0" fill="#4c0519" stroke="#fb7185" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="695.0" y="500.075" font-size="14.5" font-weight="700" fill="#fb7185" text-anchor="middle">Reports a problem</text>
<path d="M790,495 L830,495" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="842" y="500" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="start">REOPENED: a dispute always wins</text>
<path d="M510,495 L555,495 L555,550 L600,550" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="600" y="531" width="190" height="38" rx="19.0" fill="#082f49" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="695.0" y="555.075" font-size="14.5" font-weight="700" fill="#38bdf8" text-anchor="middle">No response</text>
<path d="M790,550 L830,550" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="842" y="555" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="start">Closed automatically</text>
</svg>