<text x="650.0" y="58" text-anchor="middle" font-size="31" font-weight="800" fill="#f8fafc">Ticket lifecycle</text>
<text x="650.0" y="88" text-anchor="middle" font-size="16.5" fill="#94a3b8">Every transition is a row in one tested table. Anything not in it is refused with a 409.</text>
