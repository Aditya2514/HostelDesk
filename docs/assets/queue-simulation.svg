<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Queue simulation: who finishes first?</title><desc id="d">Monday 4:30 PM, a new 60-minute tap repair. Ramesh finishes Tuesday 10:05 AM, Suresh Tuesday 10:00 AM, Anil Monday 5:30 PM, so Anil gets it.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#070b17"/></linearGradient>
<marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 z" fill="#94a3b8"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.45"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2"/></filter>
<style>
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes march{to{stroke-dashoffset:-24}}
.rise{animation:rise .65s cubic-bezier(.2,.8,.2,1) backwards}
.march{animation:march 1.1s linear infinite}
</style>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#0a1022"/><line x1="0" y1="0" x2="0" y2="10" stroke="#243049" stroke-width="4"/></pattern></defs>
<rect width="1200" height="790" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="788" rx="21" fill="none" stroke="#1e293b" stroke-width="2"/>
<text x="600.0" y="58" text-anchor="middle" font-size="31" font-weight="800" fill="#f8fafc">Who finishes first?</text>
<text x="600.0" y="88" text-anchor="middle" font-size="16.5" fill="#94a3b8">Monday 4:30 PM · a new 60-minute tap repair · shifts 9-1 and 2-6</text>
<text x="230" y="134" font-size="13" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="1.2">MON 4:30 PM</text>
<line x1="230" y1="142" x2="230" y2="598" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 5"/>
<text x="590.0" y="134" font-size="13" font-weight="800" fill="#94a3b8" text-anchor="end" letter-spacing="1.2">6:00 PM</text>
<line x1="590.0" y1="142" x2="590.0" y2="598" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 5"/>
<text x="650.0" y="134" font-size="13" font-weight="800" fill="#94a3b8" text-anchor="start" letter-spacing="1.2">TUE 9:00 AM</text>
<line x1="650.0" y1="142" x2="650.0" y2="598" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 5"/>
<text x="1010.0" y="134" font-size="13" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="1.2">10:30 AM</text>
<line x1="1010.0" y1="142" x2="1010.0" y2="598" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 5"/>
<rect x="594.0" y="146" width="52" height="450" rx="8" fill="url(#hatch)"/>
<text x="620.0" y="372" font-size="11.5" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="2">NIGHT</text>
<g class="rise" style="animation-delay:0.00s"><rect x="30" y="156" width="1140" height="118" rx="14" fill="#0b1224" stroke="#1e293b" stroke-width="1.5" fill-opacity="0.55"/><text x="50" y="196" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="start">Ramesh</text><text x="50" y="218" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">Works to 6 PM. An urgent</text><text x="50" y="235" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">45m and an older 50m job</text><text x="50" y="252" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">are ahead.</text></g>
<g class="rise" style="animation-delay:0.08s"><rect x="30" y="288" width="1140" height="118" rx="14" fill="#0b1224" stroke="#1e293b" stroke-width="1.5" fill-opacity="0.55"/><text x="50" y="328" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="start">Suresh</text><text x="50" y="350" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">Off on Monday. Empty</text><text x="50" y="367" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">queue.</text></g>
<g class="rise" style="animation-delay:0.16s"><rect x="30" y="420" width="1140" height="118" rx="14" fill="#0b1224" stroke="#1e293b" stroke-width="1.5" fill-opacity="0.55"/><text x="50" y="460" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="start">Anil</text><text x="50" y="482" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">Works until 6 PM. Empty</text><text x="50" y="499" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">queue.</text></g>
<rect x="230.0" y="192" width="0" height="46" rx="8" fill="#4c0519" stroke="#fb7185" stroke-width="2" ><animate attributeName="width" values="0;0;180.0;180.0;0" keyTimes="0;0.0600;0.1067;0.9400;1" dur="15.0s" repeatCount="indefinite"/></rect>
<g opacity="0"><text x="320.0" y="220.0" font-size="13.5" font-weight="800" fill="#fda4af" text-anchor="middle">URGENT · 45m</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1000;0.1233;0.9400;1" dur="15.0s" repeatCount="indefinite"/></g>
<rect x="410.0" y="192" width="0" height="46" rx="8" fill="#451a03" stroke="#fbbf24" stroke-width="2" ><animate attributeName="width" values="0;0;180.0;180.0;0" keyTimes="0;0.1200;0.1667;0.9400;1" dur="15.0s" repeatCount="indefinite"/></rect>
<g opacity="0"><text x="500.0" y="220.0" font-size="13.5" font-weight="800" fill="#fcd34d" text-anchor="middle">OLDER · 50m</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1600;0.1833;0.9400;1" dur="15.0s" repeatCount="indefinite"/></g>
<rect x="650.0" y="192" width="0" height="46" rx="8" fill="#451a03" stroke="#fbbf24" stroke-width="2" ><animate attributeName="width" values="0;0;20.0;20.0;0" keyTimes="0;0.1800;0.1933;0.9400;1" dur="15.0s" repeatCount="indefinite"/></rect>
<rect x="670.0" y="192" width="0" height="46" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" ><animate attributeName="width" values="0;0;240.0;240.0;0" keyTimes="0;0.2067;0.2667;0.9400;1" dur="15.0s" repeatCount="indefinite"/></rect>
<g opacity="0"><text x="790.0" y="220.0" font-size="13.5" font-weight="800" fill="#c7d2fe" text-anchor="middle">NEW · 60m</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2600;0.2833;0.9400;1" dur="15.0s" repeatCount="indefinite"/></g>
<g opacity="0"><text x="924.0" y="220.0" font-size="15" font-weight="700" fill="#cbd5e1">finishes Tue 10:05 AM</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2733;0.2967;0.9400;1" dur="15.0s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="230.0" y="324" width="360.0" height="46" rx="8" fill="url(#hatch)" stroke="#334155" stroke-width="1.5"/><text x="410.0" y="352.0" font-size="13.5" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="1.5">DAY OFF</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3067;0.3300;0.9400;1" dur="15.0s" repeatCount="indefinite"/></g>
<rect x="650.0" y="324" width="0" height="46" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" ><animate attributeName="width" values="0;0;240.0;240.0;0" keyTimes="0;0.3333;0.3933;0.9400;1" dur="15.0s" repeatCount="indefinite"/></rect>
<g opacity="0"><text x="770.0" y="352.0" font-size="13.5" font-weight="800" fill="#c7d2fe" text-anchor="middle">NEW · 60m</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3867;0.4100;0.9400;1" dur="15.0s" repeatCount="indefinite"/></g>
<g opacity="0"><text x="904.0" y="352.0" font-size="15" font-weight="700" fill="#cbd5e1">finishes Tue 10:00 AM</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4000;0.4233;0.9400;1" dur="15.0s" repeatCount="indefinite"/></g>
<rect x="230.0" y="456" width="0" height="46" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" ><animate attributeName="width" values="0;0;240.0;240.0;0" keyTimes="0;0.4333;0.4933;0.9400;1" dur="15.0s" repeatCount="indefinite"/></rect>
<g opacity="0"><text x="350.0" y="484.0" font-size="13.5" font-weight="800" fill="#c7d2fe" text-anchor="middle">NEW · 60m</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4867;0.5100;0.9400;1" dur="15.0s" repeatCount="indefinite"/></g>
<g opacity="0"><text x="484.0" y="484.0" font-size="15" font-weight="800" fill="#34d399">finishes Mon 5:30 PM</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5067;0.5300;0.9400;1" dur="15.0s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="26" y="416" width="1148" height="126" rx="18" fill="none" stroke="#34d399" stroke-width="5" filter="url(#glow)"/><rect x="29" y="419" width="1142" height="120" rx="15" fill="none" stroke="#34d399" stroke-width="2.6"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5467;0.5587;0.8900;0.9067;1.0000" dur="15.0s" repeatCount="indefinite"/></g>
<g opacity="0"><g><rect x="1040" y="454" width="110" height="38" rx="19" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="1095" y="479" font-size="15" font-weight="800" fill="#6ee7b7" text-anchor="middle">✓ ASSIGNED</text></g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5600;0.5833;0.9400;1" dur="15.0s" repeatCount="indefinite"/></g>
<g class="rise" style="animation-delay:0.24s"><rect x="30" y="566" width="1140" height="1" fill="none"/></g>
<g opacity="0"><rect x="30" y="560" width="1140" height="76" rx="14" fill="#06251d" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5"/><text x="56" y="592" font-size="18" font-weight="800" fill="#6ee7b7">Anil gets the ticket: the earliest finish, not the fewest tickets.</text><text x="56" y="618" font-size="14.5" fill="#cbd5e1">Suresh has the same empty queue, but his day off pushes the job to Tuesday. A plain ticket count would have missed that.</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5867;0.6100;0.9200;1" dur="15.0s" repeatCount="indefinite"/></g>
<rect x="50" y="672" width="22" height="16" rx="4" fill="#4c0519" stroke="#fb7185" stroke-width="2"/>
<text x="82" y="685" font-size="13.5" font-weight="400" fill="#94a3b8" text-anchor="start">Urgent job ahead</text>
<rect x="280" y="672" width="22" height="16" rx="4" fill="#451a03" stroke="#fbbf24" stroke-width="2"/>
<text x="312" y="685" font-size="13.5" font-weight="400" fill="#94a3b8" text-anchor="start">Older normal job</text>
<rect x="510" y="672" width="22" height="16" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
<text x="542" y="685" font-size="13.5" font-weight="400" fill="#94a3b8" text-anchor="start">The new ticket</text>
<rect x="740" y="672" width="22" height="16" rx="4" fill="url(#hatch)" stroke="#334155" stroke-width="2"/>
<text x="772" y="685" font-size="13.5" font-weight="400" fill="#94a3b8" text-anchor="start">Off / night</text>
<text x="50" y="735" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">Each queue is laid into the technician's real shift windows: in-progress first, then urgent, normal, low; oldest first within a priority.</text>
<text x="50" y="757" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">Asserted by server/tests/simulator.test.ts.</text>
</svg>