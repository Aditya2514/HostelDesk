<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Architecture</title><desc id="d">Browsers talk to a Vercel app that proxies /api to a stateless Render API, backed by Neon PostgreSQL and Cloudinary, with cron-job.org triggering jobs.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#070b17"/></linearGradient>
<marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 z" fill="#94a3b8"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.45"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2"/></filter>
<style>
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes march{to{stroke-dashoffset:-24}}
.rise{animation:rise .65s cubic-bezier(.2,.8,.2,1) backwards}
.march{animation:march 1.1s linear infinite}
</style>
</defs>
<rect width="1200" height="800" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="798" rx="21" fill="none" stroke="#1e293b" stroke-width="2"/>
<text x="600.0" y="58" text-anchor="middle" font-size="31" font-weight="800" fill="#f8fafc">Architecture</text>
<text x="600.0" y="88" text-anchor="middle" font-size="16.5" fill="#94a3b8">Stateless server, external scheduler, one first-party origin.</text>
<text x="40" y="126" font-size="13" font-weight="800" fill="#64748b" text-anchor="start" letter-spacing="2.2">USERS</text>
<g class="rise" style="animation-delay:0.00s"><g><rect x="40" y="140" width="220" height="110" rx="14" fill="#0d1428" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.5"/></g><rect x="40" y="154" width="5" height="82" rx="2.5" fill="#34d399"/><text x="64" y="170" font-size="15" font-weight="800" fill="#34d399" text-anchor="start" letter-spacing="0.6">Student phone</text><text x="64" y="200" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">Raises tickets, sees</text><text x="64" y="221" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">ETA and code</text></g>
<g class="rise" style="animation-delay:0.08s"><g><rect x="40" y="270" width="220" height="110" rx="14" fill="#0d1428" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.5"/></g><rect x="40" y="284" width="5" height="82" rx="2.5" fill="#fbbf24"/><text x="64" y="300" font-size="15" font-weight="800" fill="#fbbf24" text-anchor="start" letter-spacing="0.6">Technician phone</text><text x="64" y="330" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">Queue, photos, resolve</text></g>
<g class="rise" style="animation-delay:0.16s"><g><rect x="40" y="400" width="220" height="110" rx="14" fill="#0d1428" stroke="#c084fc" stroke-opacity="0.55" stroke-width="1.5"/></g><rect x="40" y="414" width="5" height="82" rx="2.5" fill="#c084fc"/><text x="64" y="430" font-size="15" font-weight="800" fill="#c084fc" text-anchor="start" letter-spacing="0.6">Warden / admin laptop</text><text x="64" y="460" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">Disputes, analytics,</text><text x="64" y="481" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">admin</text></g>
<g class="rise" style="animation-delay:0.24s"><g filter="url(#sh)"><rect x="330" y="235" width="210" height="240" rx="14" fill="#0d1428" stroke="#94a3b8" stroke-opacity="0.55" stroke-width="1.5"/></g><rect x="330" y="249" width="5" height="212" rx="2.5" fill="#94a3b8"/><text x="354" y="265" font-size="15.5" font-weight="800" fill="#94a3b8" text-anchor="start" letter-spacing="0.6">VERCEL</text><text x="354" y="295" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">React + Vite app,</text><text x="354" y="316.5" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">served as static</text><text x="354" y="338.0" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">files.</text><text x="354" y="359.5" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">A rewrite forwards</text><text x="354" y="381.0" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">/api/* to the API, so</text><text x="354" y="402.5" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">the login cookie is</text><text x="354" y="424.0" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">first-party and works</text><text x="354" y="445.5" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">on Safari.</text></g>
<g class="rise" style="animation-delay:0.20s"><path d="M260,195 L295,195 L295,355 L330,355" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/></g>
<g opacity="0"><circle r="10" fill="#c7d2fe" opacity=".35" filter="url(#glow)"/><circle r="4.2" fill="#fff"/><animateMotion path="M260,195 L295,195 L295,355 L330,355" dur="3.03s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0659;0.5714;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0659;0.0959;0.5414;0.5714;1" dur="3.03s" repeatCount="indefinite"/></g>
<g class="rise" style="animation-delay:0.25s"><path d="M260,325 L295,325 L295,355 L330,355" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/></g>
<g opacity="0"><circle r="10" fill="#c7d2fe" opacity=".35" filter="url(#glow)"/><circle r="4.2" fill="#fff"/><animateMotion path="M260,325 L295,325 L295,355 L330,355" dur="2.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2375;0.6125;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2375;0.2675;0.5825;0.6125;1" dur="2.40s" repeatCount="indefinite"/></g>
<g class="rise" style="animation-delay:0.30s"><path d="M260,455 L295,455 L295,355 L330,355" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/></g>
<g opacity="0"><circle r="10" fill="#c7d2fe" opacity=".35" filter="url(#glow)"/><circle r="4.2" fill="#fff"/><animateMotion path="M260,455 L295,455 L295,355 L330,355" dur="2.67s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3516;0.7756;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3516;0.3816;0.7456;0.7756;1" dur="2.67s" repeatCount="indefinite"/></g>
<text x="296" y="180" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">HTTPS</text>
<rect x="610" y="130" width="330" height="460" rx="16" fill="#0d1428" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.5"/>
<text x="632" y="164" font-size="13" font-weight="800" fill="#818cf8" text-anchor="start" letter-spacing="1.5">RENDER  ·  EXPRESS API</text>
<text x="632" y="184" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">stateless</text>
<g class="rise" style="animation-delay:0.56s"><rect x="634" y="204" width="138" height="36" rx="18.0" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.8" stroke-width="1.5"/><text x="703.0" y="227.075" font-size="14.5" font-weight="700" fill="#818cf8" text-anchor="middle">auth</text></g>
<g class="rise" style="animation-delay:0.64s"><rect x="782" y="204" width="138" height="36" rx="18.0" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.8" stroke-width="1.5"/><text x="851.0" y="227.075" font-size="14.5" font-weight="700" fill="#818cf8" text-anchor="middle">tickets</text></g>
<g class="rise" style="animation-delay:0.72s"><rect x="634" y="252" width="138" height="36" rx="18.0" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.8" stroke-width="1.5"/><text x="703.0" y="275.075" font-size="14.5" font-weight="700" fill="#818cf8" text-anchor="middle">scheduling</text></g>
<g class="rise" style="animation-delay:0.80s"><rect x="782" y="252" width="138" height="36" rx="18.0" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.8" stroke-width="1.5"/><text x="851.0" y="275.075" font-size="14.5" font-weight="700" fill="#818cf8" text-anchor="middle">evidence</text></g>
<g class="rise" style="animation-delay:0.88s"><rect x="634" y="300" width="138" height="36" rx="18.0" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.8" stroke-width="1.5"/><text x="703.0" y="323.075" font-size="14.5" font-weight="700" fill="#818cf8" text-anchor="middle">disputes</text></g>
<g class="rise" style="animation-delay:0.96s"><rect x="782" y="300" width="138" height="36" rx="18.0" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.8" stroke-width="1.5"/><text x="851.0" y="323.075" font-size="14.5" font-weight="700" fill="#818cf8" text-anchor="middle">jobs</text></g>
<g class="rise" style="animation-delay:1.04s"><rect x="634" y="348" width="138" height="36" rx="18.0" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.8" stroke-width="1.5"/><text x="703.0" y="371.075" font-size="14.5" font-weight="700" fill="#818cf8" text-anchor="middle">analytics</text></g>
<g class="rise" style="animation-delay:1.12s"><rect x="782" y="348" width="138" height="36" rx="18.0" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.8" stroke-width="1.5"/><text x="851.0" y="371.075" font-size="14.5" font-weight="700" fill="#818cf8" text-anchor="middle">admin</text></g>
<text x="634" y="428" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">Row-locked transactions guard</text>
<text x="634" y="449" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">codes, state changes and the</text>
<text x="634" y="470" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">dispute-wins rule.</text>
<text x="634" y="510" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">Every job is idempotent, so any</text>
<text x="634" y="531" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">instance can run it, and a retry</text>
<text x="634" y="552" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">does no harm.</text>
<g class="rise" style="animation-delay:0.75s"><path d="M540,355 L610,355" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="546.8" y="333" width="56.400000000000006" height="21" rx="6" fill="#0a1022"/><text x="575" y="348" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">/api/*</text></g>
<g opacity="0"><circle r="10" fill="#c7d2fe" opacity=".35" filter="url(#glow)"/><circle r="4.2" fill="#fff"/><animateMotion path="M540,355 L610,355" dur="2.81s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4662;0.7865;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4662;0.4962;0.7565;0.7865;1" dur="2.81s" repeatCount="indefinite"/></g>
<text x="1000" y="126" font-size="13" font-weight="800" fill="#64748b" text-anchor="start" letter-spacing="2.2">DATA</text>
<g class="rise" style="animation-delay:1.28s"><g filter="url(#sh)"><rect x="1000" y="140" width="160" height="200" rx="14" fill="#0d1428" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5"/></g><rect x="1000" y="154" width="5" height="172" rx="2.5" fill="#38bdf8"/><text x="1024" y="170" font-size="14.5" font-weight="800" fill="#38bdf8" text-anchor="start" letter-spacing="0.6">NEON</text><text x="1024" y="200" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">PostgreSQL:</text><text x="1024" y="220.5" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">pooled URL for</text><text x="1024" y="241.0" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">the app, direct</text><text x="1024" y="261.5" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">URL for</text><text x="1024" y="282.0" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">migrations.</text></g>
<g class="rise" style="animation-delay:1.36s"><g filter="url(#sh)"><rect x="1000" y="380" width="160" height="150" rx="14" fill="#0d1428" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.5"/></g><rect x="1000" y="394" width="5" height="122" rx="2.5" fill="#fbbf24"/><text x="1024" y="410" font-size="14.5" font-weight="800" fill="#fbbf24" text-anchor="start" letter-spacing="0.6">CLOUDINARY</text><text x="1024" y="440" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">Photo evidence,</text><text x="1024" y="460.5" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">uploaded with</text><text x="1024" y="481.0" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">signed</text><text x="1024" y="501.5" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">requests.</text></g>
<g class="rise" style="animation-delay:0.90s"><path d="M940,240 L1000,240" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="941.8" y="218" width="56.400000000000006" height="21" rx="6" fill="#0a1022"/><text x="970" y="233" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">Prisma</text></g>
<g opacity="0"><circle r="10" fill="#c7d2fe" opacity=".35" filter="url(#glow)"/><circle r="4.2" fill="#fff"/><animateMotion path="M940,240 L1000,240" dur="3.18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5283;0.8113;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5283;0.5583;0.7813;0.8113;1" dur="3.18s" repeatCount="indefinite"/></g>
<g class="rise" style="animation-delay:0.95s"><path d="M940,455 L1000,455" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="941.8" y="433" width="56.400000000000006" height="21" rx="6" fill="#0a1022"/><text x="970" y="448" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">signed</text></g>
<g opacity="0"><circle r="10" fill="#c7d2fe" opacity=".35" filter="url(#glow)"/><circle r="4.2" fill="#fff"/><animateMotion path="M940,455 L1000,455" dur="3.55s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5775;0.8310;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5775;0.6075;0.8010;0.8310;1" dur="3.55s" repeatCount="indefinite"/></g>
<g class="rise" style="animation-delay:1.60s"><g filter="url(#sh)"><rect x="610" y="630" width="330" height="140" rx="14" fill="#0d1428" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.5"/></g><rect x="610" y="644" width="5" height="112" rx="2.5" fill="#34d399"/><text x="634" y="660" font-size="14.5" font-weight="800" fill="#34d399" text-anchor="start" letter-spacing="0.6">CRON-JOB.ORG</text><text x="634" y="690" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">POST /api/jobs/tick every 5 minutes</text><text x="634" y="710.5" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">with a secret header: escalation,</text><text x="634" y="731.0" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">auto-close, queue recompute. Also</text><text x="634" y="751.5" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">keeps the free instance awake.</text></g>
<g class="rise" style="animation-delay:1.05s"><path d="M775,630 L775,590" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="6 6" class="march" marker-end="url(#arr)"/></g>
<g opacity="0"><circle r="10" fill="#c7d2fe" opacity=".35" filter="url(#glow)"/><circle r="4.2" fill="#fff"/><animateMotion path="M775,630 L775,590" dur="3.92s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6173;0.8469;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6173;0.6473;0.8169;0.8469;1" dur="3.92s" repeatCount="indefinite"/></g>
<text x="40" y="640" font-size="13" font-weight="800" fill="#64748b" text-anchor="start" letter-spacing="2.2">WHY THIS SHAPE</text>
<text x="40" y="670" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">Render's free tier sleeps, so timers live</text>
<text x="40" y="694" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">outside the server. That also keeps the API</text>
<text x="40" y="718" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">stateless, so adding instances needs no</text>
<text x="40" y="742" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="start">code change.</text>
</svg>