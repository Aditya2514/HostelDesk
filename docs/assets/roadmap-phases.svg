<text x="600.0" y="58" text-anchor="middle" font-size="31" font-weight="800" fill="#f8fafc">What could start sooner, and what waits</text>
<text x="600.0" y="88" text-anchor="middle" font-size="16.5" fill="#94a3b8">Grouped by what each idea needs first · the order is my planning estimate</text>
<g class="rise" style="animation-delay:0.00s"><g filter="url(#sh)"><rect x="40" y="124" width="340" height="118" rx="16" fill="#064e3b" stroke="#34d399" stroke-width="2"/></g><text x="62" y="158" font-size="16" font-weight="800" fill="#34d399" text-anchor="start" letter-spacing="1.4">SOONER</text><text x="62" y="184" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">Pretrained models, no history needed</text><text x="62" y="218" font-size="11.5" font-weight="800" fill="#94a3b8" text-anchor="start" letter-spacing="1.6">REAL DATA NEEDED</text><circle cx="216" cy="214" r="7" fill="#34d399" stroke="#34d399" stroke-width="1.5"/><circle cx="238" cy="214" r="7" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/><circle cx="260" cy="214" r="7" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/></g>
<g opacity="0"><rect x="36" y="120" width="348" height="126" rx="20" fill="none" stroke="#34d399" stroke-width="5" filter="url(#glow)"/><rect x="39" y="123" width="342" height="120" rx="17" fill="none" stroke="#34d399" stroke-width="2.6"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0001;0.0150;0.3125;0.3333;1.0000" dur="12.0s" repeatCount="indefinite"/></g>
<g class="rise" style="animation-delay:0.08s"><g filter="url(#sh)"><rect x="430" y="124" width="340" height="118" rx="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/></g><text x="452" y="158" font-size="16" font-weight="800" fill="#818cf8" text-anchor="start" letter-spacing="1.4">NEEDS REAL USAGE DATA</text><text x="452" y="184" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">Learns from how the hostel actually behaves</text><text x="452" y="218" font-size="11.5" font-weight="800" fill="#94a3b8" text-anchor="start" letter-spacing="1.6">REAL DATA NEEDED</text><circle cx="606" cy="214" r="7" fill="#818cf8" stroke="#818cf8" stroke-width="1.5"/><circle cx="628" cy="214" r="7" fill="#818cf8" stroke="#818cf8" stroke-width="1.5"/><circle cx="650" cy="214" r="7" fill="#818cf8" stroke="#818cf8" stroke-width="1.5"/></g>
<g opacity="0"><rect x="426" y="120" width="348" height="126" rx="20" fill="none" stroke="#818cf8" stroke-width="5" filter="url(#glow)"/><rect x="429" y="123" width="342" height="120" rx="17" fill="none" stroke="#818cf8" stroke-width="2.6"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3483;0.6458;0.6667;1.0000" dur="12.0s" repeatCount="indefinite"/></g>
<g class="rise" style="animation-delay:0.16s"><g filter="url(#sh)"><rect x="820" y="124" width="340" height="118" rx="16" fill="#451a03" stroke="#fbbf24" stroke-width="2"/></g><text x="842" y="158" font-size="16" font-weight="800" fill="#fbbf24" text-anchor="start" letter-spacing="1.4">NEEDS PRIVACY CARE</text><text x="842" y="184" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">Touches photos of people's rooms</text><text x="842" y="218" font-size="11.5" font-weight="800" fill="#94a3b8" text-anchor="start" letter-spacing="1.6">REAL DATA NEEDED</text><circle cx="996" cy="214" r="7" fill="#fbbf24" stroke="#fbbf24" stroke-width="1.5"/><circle cx="1018" cy="214" r="7" fill="#fbbf24" stroke="#fbbf24" stroke-width="1.5"/><circle cx="1040" cy="214" r="7" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/></g>
<g opacity="0"><rect x="816" y="120" width="348" height="126" rx="20" fill="none" stroke="#fbbf24" stroke-width="5" filter="url(#glow)"/><rect x="819" y="123" width="342" height="120" rx="17" fill="none" stroke="#fbbf24" stroke-width="2.6"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.6817;0.9792;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/></g>
<g class="rise" style="animation-delay:0.15s"><path d="M382,183 L426,183" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/></g>
<g opacity="0"><circle r="10" fill="#c7d2fe" opacity=".35" filter="url(#glow)"/><circle r="4.2" fill="#fff"/><animateMotion path="M382,183 L426,183" dur="12.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2500;0.3167;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2500;0.2667;0.3000;0.3167;1" dur="12.00s" repeatCount="indefinite"/></g>
<g class="rise" style="animation-delay:0.20s"><path d="M772,183 L816,183" fill="none" stroke="#94a3b8" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arr)"/></g>
<g opacity="0"><circle r="10" fill="#c7d2fe" opacity=".35" filter="url(#glow)"/><circle r="4.2" fill="#fff"/><animateMotion path="M772,183 L816,183" dur="12.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5833;0.6500;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5833;0.6000;0.6333;0.6500;1" dur="12.00s" repeatCount="indefinite"/></g>
<g class="rise" style="animation-delay:0.40s"><g filter="url(#sh)"><rect x="40" y="268" width="340" height="92" rx="14" fill="#0d1428" stroke="#34d399" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="7 6"/></g><rect x="40" y="282" width="5" height="64" rx="2.5" fill="#34d399"/><circle cx="78" cy="302" r="17" fill="#064e3b" stroke="#34d399" stroke-width="2.2"/><text x="78" y="308" font-size="17" font-weight="800" fill="#34d399" text-anchor="middle">3</text><text x="108" y="303" font-size="14.5" font-weight="800" fill="#f8fafc" text-anchor="start">Duplicate detection</text><text x="108" y="334" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">Text embeddings find reports that</text><text x="108" y="354.5" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">mean the same thing.</text></g>
<g class="rise" style="animation-delay:0.48s"><g filter="url(#sh)"><rect x="40" y="372" width="340" height="92" rx="14" fill="#0d1428" stroke="#c084fc" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="7 6"/></g><rect x="40" y="386" width="5" height="64" rx="2.5" fill="#c084fc"/><circle cx="78" cy="406" r="17" fill="#3b0764" stroke="#c084fc" stroke-width="2.2"/><text x="78" y="412" font-size="17" font-weight="800" fill="#c084fc" text-anchor="middle">4</text><text x="108" y="407" font-size="14.5" font-weight="800" fill="#f8fafc" text-anchor="start">Category + urgency hints</text><text x="108" y="438" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">Suggests a category; the student</text><text x="108" y="458.5" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">confirms.</text></g>
<g class="rise" style="animation-delay:0.56s"><g filter="url(#sh)"><rect x="40" y="476" width="340" height="92" rx="14" fill="#0d1428" stroke="#c084fc" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="7 6"/></g><rect x="40" y="490" width="5" height="64" rx="2.5" fill="#c084fc"/><circle cx="78" cy="510" r="17" fill="#3b0764" stroke="#c084fc" stroke-width="2.2"/><text x="78" y="516" font-size="17" font-weight="800" fill="#c084fc" text-anchor="middle">5</text><text x="108" y="511" font-size="14.5" font-weight="800" fill="#f8fafc" text-anchor="start">Dispute summaries</text><text x="108" y="542" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">A neutral write-up for the warden,</text><text x="108" y="562.5" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">who still decides.</text></g>
<g class="rise" style="animation-delay:0.64s"><g filter="url(#sh)"><rect x="40" y="580" width="340" height="92" rx="14" fill="#0d1428" stroke="#fbbf24" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="7 6"/></g><rect x="40" y="594" width="5" height="64" rx="2.5" fill="#fbbf24"/><circle cx="78" cy="614" r="17" fill="#451a03" stroke="#fbbf24" stroke-width="2.2"/><text x="78" y="620" font-size="17" font-weight="800" fill="#fbbf24" text-anchor="middle">8</text><text x="108" y="615" font-size="14.5" font-weight="800" fill="#f8fafc" text-anchor="start">Voice + languages</text><text x="108" y="646" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">Speech-to-text and translation for</text><text x="108" y="666.5" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">complaints.</text></g>
<g class="rise" style="animation-delay:0.72s"><g filter="url(#sh)"><rect x="430" y="268" width="340" height="92" rx="14" fill="#0d1428" stroke="#818cf8" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="7 6"/></g><rect x="430" y="282" width="5" height="64" rx="2.5" fill="#818cf8"/><circle cx="468" cy="302" r="17" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.2"/><text x="468" y="308" font-size="17" font-weight="800" fill="#818cf8" text-anchor="middle">1</text><text x="498" y="303" font-size="14.5" font-weight="800" fill="#f8fafc" text-anchor="start">Learned ETA</text><text x="498" y="334" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">Beats the formula, or it doesn't</text><text x="498" y="354.5" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">ship.</text></g>
<g class="rise" style="animation-delay:0.80s"><g filter="url(#sh)"><rect x="430" y="372" width="340" height="92" rx="14" fill="#0d1428" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="7 6"/></g><rect x="430" y="386" width="5" height="64" rx="2.5" fill="#38bdf8"/><circle cx="468" cy="406" r="17" fill="#082f49" stroke="#38bdf8" stroke-width="2.2"/><text x="468" y="412" font-size="17" font-weight="800" fill="#38bdf8" text-anchor="middle">7</text><text x="498" y="407" font-size="14.5" font-weight="800" fill="#f8fafc" text-anchor="start">Shift forecasting</text><text x="498" y="438" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">Ticket volume per trade and day,</text><text x="498" y="458.5" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">from months of history.</text></g>
<g class="rise" style="animation-delay:0.88s"><g filter="url(#sh)"><rect x="430" y="476" width="340" height="92" rx="14" fill="#0d1428" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="7 6"/></g><rect x="430" y="490" width="5" height="64" rx="2.5" fill="#38bdf8"/><circle cx="468" cy="510" r="17" fill="#082f49" stroke="#38bdf8" stroke-width="2.2"/><text x="468" y="516" font-size="17" font-weight="800" fill="#38bdf8" text-anchor="middle">6</text><text x="498" y="511" font-size="14.5" font-weight="800" fill="#f8fafc" text-anchor="start">Preventive maintenance</text><text x="498" y="542" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">Predicts repeat failures from room</text><text x="498" y="562.5" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">and fixture history.</text></g>
<g class="rise" style="animation-delay:0.96s"><g filter="url(#sh)"><rect x="820" y="268" width="340" height="92" rx="14" fill="#0d1428" stroke="#fb923c" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="7 6"/></g><rect x="820" y="282" width="5" height="64" rx="2.5" fill="#fb923c"/><circle cx="858" cy="302" r="17" fill="#431407" stroke="#fb923c" stroke-width="2.2"/><text x="858" y="308" font-size="17" font-weight="800" fill="#fb923c" text-anchor="middle">2</text><text x="888" y="303" font-size="14.5" font-weight="800" fill="#f8fafc" text-anchor="start">Photo verification</text><text x="888" y="334" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">Flags reused or unrelated photos</text><text x="888" y="354.5" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">for the warden.</text></g>
<g class="rise" style="animation-delay:1.04s"><rect x="820" y="392" width="340" height="164" rx="14" fill="#0a1022" stroke="#475569" stroke-dasharray="4 6" stroke-width="1.5"/><text x="842" y="424" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="start">Before any model sees room photos:</text><text x="842" y="450" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">• consent from the occupants</text><text x="842" y="476" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">• a retention limit</text><text x="842" y="502" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">• a person reviews every flag</text><text x="842" y="528" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start">• a plan for false positives</text></g>
<text x="40" y="700" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">Ratings and ordering are planning estimates, not measurements. Nothing on this page is built in v1.0.0.</text>
</svg>