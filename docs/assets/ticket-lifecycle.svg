<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Ticket lifecycle</title><desc id="d">State machine: raised, assigned, in progress, awaiting access, on hold, resolved, awaiting verification, closed, reopened, rejected.</desc>
